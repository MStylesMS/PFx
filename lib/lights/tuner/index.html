<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PFx Lights Scene Tuner</title>
    <style>
        :root {
            --bg: #f7f7f7;
            --panel: #ffffff;
            --text: #1f1f1f;
            --line: #d7d7d7;
            --accent: #1756a9;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        .note {
            margin: 0 0 16px;
            font-size: 14px;
            line-height: 1.4;
        }

        .toolbar,
        .buttons,
        .compare {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .toolbar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #333;
        }

        select,
        button,
        input[type="number"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            padding: 6px;
        }

        button {
            cursor: pointer;
            border: 1px solid #b0b0b0;
            background: #f2f2f2;
            border-radius: 4px;
        }

        button.primary {
            border-color: #0f4f9f;
            background: var(--accent);
            color: #fff;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px;
        }

        .panel h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .control {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e0e0e0;
        }

        .control:last-child {
            border-bottom: 0;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .range-row {
            display: grid;
            grid-template-columns: 1fr 92px;
            gap: 8px;
            align-items: center;
        }

        .bool-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .compare pre,
        .output pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            line-height: 1.35;
        }

        .output {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px;
        }

        textarea {
            min-height: 260px;
            font-family: Consolas, "Courier New", monospace;
        }

        @media (max-width: 900px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>PFx Scene Tuner</h1>
        <p class="note">
            Select any two bulb types, pick a scene, and tune native values side by side.
            Use Export/Copy/Download to produce scene-map snippets for backend constants.
        </p>

        <section class="toolbar">
            <div class="toolbar-grid">
                <div>
                    <label for="bulbA">Bulb Type A</label>
                    <select id="bulbA"></select>
                </div>
                <div>
                    <label for="bulbB">Bulb Type B</label>
                    <select id="bulbB"></select>
                </div>
                <div>
                    <label for="sceneName">Scene</label>
                    <select id="sceneName"></select>
                </div>
                <div>
                    <label for="newSceneName">Create Scene</label>
                    <input id="newSceneName" type="text" placeholder="customSceneName">
                </div>
                <div>
                    <label for="exportFormat">Export Format</label>
                    <select id="exportFormat">
                        <option value="json" selected>JSON Object</option>
                        <option value="js">JavaScript Constants</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="panels">
            <div id="panelA" class="panel"></div>
            <div id="panelB" class="panel"></div>
        </section>

        <section class="buttons">
            <div class="buttons-grid">
                <button id="createSceneBtn">Create Scene</button>
                <button id="resetSceneBtn">Reset Scene To Defaults</button>
                <button id="exportBtn" class="primary">Export Selected Bulbs</button>
                <button id="copyBtn">Copy Export To Clipboard</button>
                <button id="downloadBtn">Download Export</button>
            </div>
        </section>

        <section class="compare">
            <h2>Normalized Compare</h2>
            <pre id="compareText"></pre>
        </section>

        <section class="output">
            <h2>Export Output</h2>
            <textarea id="exportText"></textarea>
        </section>
    </main>
    <script src="scripts.js"></script>
</body>

</html>
