# ParadoxFX Raspberry Pi 3 Configuration (H)
# ==========================================
# Supports: HDMI-0 only (H = HDMI only)
# Copy to pfx.ini or use on its own for Pi3 single HDMI

[mqtt]
broker = localhost
port = 1883
client_id = pfx-pi3-h
keepalive = 60
clean_session = true

base_topic = paradox
device_name = pi3-h

[global]
log_level = info
message_level = info
; media_base_path = /opt/paradox/media   ; DEPRECATED — use per-device `media_dir` in each [screen:] / [audio:] section
heartbeat_enabled = true
heartbeat_interval = 10000
heartbeat_topic = paradox/heartbeat
ducking_adjust = -40

# HDMI0 audio zone only
[screen:hdmi0]
type = screen
topic = paradox/hdmi0/screen
media_dir = hdmi0
display = :0
# Force HDMI-0 to a Pi3-friendly 640x480 mode before mpv starts (falls back to 800x600 if unavailable)
output_name = HDMI-1
resolution_mode = 640x480@60
resolution_fallback = 800x600@60
audio_device = default
background_volume = 80
speech_volume = 90
effects_volume = 100
video_volume = 85
max_volume = 150
