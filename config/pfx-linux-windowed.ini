# ParadoxFX Configuration - Linux Windowed Mode for Testing
# This configuration uses the linux-windowed profile for development and testing

[global]
application_name = ParadoxFX
log_level = info

[mqtt]
server = localhost
port = 1883
base_topic = paradox/pfx
heartbeat_topic = paradox/pfx/heartbeat
heartbeat_interval = 30000
clean_session = true
keep_alive = 60
reconnect_period = 1500

[screen:screen0]
display = :0
target_monitor = 0
audio_device = pulse/alsa_output.pci-0000_00_1f.3.analog-stereo
default_image = media/default.jpg
mpv_video_profile = linux-windowed
video_volume = 80
background_music_volume = 70
effects_volume = 100
max_volume = 150

[screen:screen1]
display = :0
target_monitor = 1
audio_device = pulse/alsa_output.pci-0000_00_1f.3.analog-stereo
default_image = media/default.jpg
mpv_video_profile = linux-windowed
video_volume = 80
background_music_volume = 70
effects_volume = 100
max_volume = 150
