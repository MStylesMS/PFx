# ParadoxFX Raspberry Pi 4 Configuration (HHA)
# ============================================
# Supports: HDMI-0, HDMI-1, Headphones audio (HHA = 2 HDMI + Headphone + Audio)
# Copy to pfx.ini or use on its own for full Pi4 setup with analog and both HDMI outputs
#
# REQUIREMENTS:
# - X11 display system (not Wayland) - use 'sudo raspi-config' to switch
# - PulseAudio (or PipeWire with PulseAudio compatibility)
# - /boot/firmware/config.txt must include:
#     gpu_mem=256
#     hdmi_force_hotplug=1
#     hdmi_drive=2
#     hdmi_group=2
#     hdmi_mode=82
#     consoleblank=0
# - Screen blanking disabled: run scripts/disable-screen-blanking.sh

[mqtt]
broker = 127.0.0.1
port = 1883
# username =           # Not required for unsecured brokers
# password =           # Not required for unsecured brokers
client_id = pfx-pi4-hha
keepalive = 60
clean_session = true

base_topic = paradox
device_name = pi4-hha

[global]
log_level = info
message_level = info
heartbeat_enabled = true
heartbeat_interval = 10000
heartbeat_topic = paradox/heartbeat
ducking_adjust = -40

# Dual HDMI screen zones with Pi4 optimizations
[screen:zone1-hdmi0]
type = screen
topic = paradox/zone1/screen
media_dir = zone1
volume = 80
player_type = mpv
audio_device = pulse/alsa_output.platform-fef00700.hdmi.hdmi-stereo
display = :0
target_monitor = 0
default_image = default.png
mpv_video_profile = pi4-sw
background_volume = 80
speech_volume = 90
effects_volume = 100
video_volume = 85
max_volume = 150

[screen:zone2-hdmi1]
type = screen
topic = paradox/zone2/screen
media_dir = zone2
volume = 80
player_type = mpv
audio_device = pulse/alsa_output.platform-fef05700.hdmi.hdmi-stereo
display = :0
target_monitor = 1
default_image = default.png
mpv_video_profile = pi4-sw
background_volume = 80
speech_volume = 90
effects_volume = 100
video_volume = 85
max_volume = 150

# Headphone audio zone
[audio:headphones]
type = audio
topic = paradox/headphones/audio
media_dir = headphones
volume = 80
audio_device = pulse/alsa_output.platform-bcm2835-audio.analog-stereo
background_volume = 60
speech_volume = 75
effects_volume = 80
ducking_adjust = -40
max_volume = 120
