# ParadoxFX Linux Configuration (H)
# =================================
# Supports: HDMI-0 only (H = HDMI only)
# Copy to pfx.ini or use on its own for generic Linux with one HDMI output

[mqtt]
broker = localhost
port = 1883
client_id = pfx-linux-h
keepalive = 60
clean_session = true

base_topic = paradox
device_name = linux-h

[global]
log_level = info
message_level = info
heartbeat_enabled = true
heartbeat_interval = 10000
heartbeat_topic = paradox/heartbeat
ducking_adjust = -40

# HDMI0 audio zone only
[screen:hdmi0]
type = screen
topic = paradox/hdmi0/screen
media_dir = hdmi0
display = :0
target_monitor = 0
audio_device = default
background_volume = 80
speech_volume = 90
effects_volume = 100
video_volume = 85
max_volume = 150
