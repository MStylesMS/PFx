# ParadoxFX Raspberry Pi 3 Configuration (HA)
# ==========================================
# Supports: HDMI-0 + Headphone audio (HA = HDMI + Headphone)
# Copy to pfx.ini or use for Pi3 single HDMI + analog audio

[mqtt]
broker = localhost
port = 1883
client_id = pfx-pi3-ha
keepalive = 60
clean_session = true

base_topic = paradox
device_name = pi3-ha

[global]
log_level = info
message_level = info
heartbeat_enabled = true
heartbeat_interval = 10000
heartbeat_topic = paradox/heartbeat
ducking_adjust = -40

# HDMI + Headphone audio zones
[screen:hdmi0]
type = screen
topic = paradox/hdmi0/screen
media_dir = hdmi0
display = :0
target_monitor = 0
audio_device = default
background_volume = 80
speech_volume = 90
effects_volume = 100
video_volume = 85
max_volume = 150

[audio:headphones]
type = audio
topic = paradox/headphones/audio
audio_device = default
background_volume = 60
speech_volume = 75
effects_volume = 80
ducking_adjust = -40
max_volume = 120
